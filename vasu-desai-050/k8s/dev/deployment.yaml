apiVersion: apps/v1
kind: Deployment
metadata:
  name: polling-app
  labels:
    app: polling-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: polling-app
  template:
    metadata:
      labels:
        app: polling-app
    spec:
      containers:
        - name: polling-app
          image: polling-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: polling-app-service
spec:
  type: NodePort
  selector:
    app: polling-app
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
